[package]
name = "breez-sdk-liquid"
edition = "2021"
version.workspace = true

[lib]
name = "breez_sdk_liquid"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
regtest = []                           # Enable regtest tests
browser-tests = []                     # Enable browser wasm-pack tests
test-utils = ["sdk-common/test-utils"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
bip39 = "2.0.0"
chrono = "0.4"
derivative = "2.2.0"
env_logger = "0.11"
futures = "0.3.31"
log = { workspace = true }
lwk_common = { git = "https://github.com/breez/lwk", rev = "5f76812020e1e8f987c6bf26d4faf4ba429b1312" }
lwk_signer = { git = "https://github.com/breez/lwk", rev = "5f76812020e1e8f987c6bf26d4faf4ba429b1312", default-features = false }
mockall = "0.13.1"
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
tokio_with_wasm = { version = "=0.8.2", features = [
    "macros",
    "rt",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1.14", features = ["sync"] }
sdk-common = { workspace = true }
sdk-macros = { workspace = true }
rusqlite_migration = { git = "https://github.com/breez/rusqlite_migration", branch = "rusqlite-v0.38.0" }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.116"
strum = "0.25"
strum_macros = "0.25"
thiserror = { workspace = true }
url = "2.5.0"
futures-util = { version = "0.3.28", default-features = false, features = [
    "sink",
    "std",
] }
web-time = "1.1.0"
async-trait = "0.1.86"
hex = "0.4"
reqwest = { version = "0.12", features = ["json"] }
zbase32 = "0.1.2"
x509-parser = { version = "0.16.0" }
tempfile = "3"
ecies = { version = "0.2.7", default-features = false, features = ["pure"] }
semver = "1.0.23"
lazy_static = "1.5.0"
esplora-client = { git = "https://github.com/breez/rust-esplora-client", branch = "connect-timeout", features = [
    "async-https-rustls",
] }
sideswap_api = { git = "https://github.com/breez/sideswap_rust", rev = "2c3c4312d8fe" }
aes = "0.8.4"
aes-gcm = "0.10.3"
# Matches boltz-client's musig secp; needed to name the musig signature types
# exposed in its public API (e.g. Cooperative::signature).
secp256k1_musig = { package = "secp256k1", version = "0.32.0-beta.0" }

# Non-Wasm dependencies
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
# Transitive deps (sdk-common, esplora-client) pull reqwest's native-tls -> openssl-sys
# on native targets. Build OpenSSL from source so it cross-compiles (e.g. Android/iOS)
# without a system OpenSSL. (The SDK itself uses rustls; wasm is unaffected.)
openssl = { version = "0.10", features = ["vendored"] }
electrum-client = { version = "0.21.0", default-features = false, features = [
    "use-rustls-ring",
    "proxy",
] }
lwk_wollet = { git = "https://github.com/breez/lwk", rev = "5f76812020e1e8f987c6bf26d4faf4ba429b1312" }
prost = "^0.11"
tonic = { version = "^0.8", features = ["tls", "tls-webpki-roots"] }
uuid = { version = "1.8.0", features = ["v4"] }
boltz-client = { git = "https://github.com/SatoshiPortal/boltz-rust", rev = "2d52ad541de5c24ea24542cbcde7cfc25628d6ed", features = [
    "electrum",
    "ws",
] }
rusqlite = { git = "https://github.com/breez/rusqlite", branch = "rusqlite-v0.38.0", features = [
    "backup",
    "bundled",
] }

# Wasm dependencies
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
console_log = "1"
sqlite-wasm-rs = { git = "https://github.com/breez/sqlite-wasm-rs", branch = "rusqlite-v0.38.0", default-features = false }
lwk_wollet = { git = "https://github.com/breez/lwk", rev = "5f76812020e1e8f987c6bf26d4faf4ba429b1312", default-features = false, features = [
    "esplora",
] }
prost = "^0.13"
uuid = { version = "1.8.0", features = ["v4", "js"] }
tonic = { version = "0.12", default-features = false, features = [
    "codegen",
    "prost",
] }
boltz-client = { git = "https://github.com/SatoshiPortal/boltz-rust", rev = "2d52ad541de5c24ea24542cbcde7cfc25628d6ed", features = [
    "ws",
] }
rusqlite = { git = "https://github.com/breez/rusqlite", branch = "rusqlite-v0.38.0", features = [
    "backup",
    "bundled",
    "serialize",
] }

[dev-dependencies]
sdk-common = { workspace = true, features = ["test-utils"] }
paste = "1.0.15"
base64 = "0.22.1"
serial_test = "3.2.0"

# Non-Wasm dev dependencies
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dev-dependencies]
tempdir = "0.3.7"

# Wasm dev dependencies
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3.33"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen-futures = "0.4.50"
gloo-timers = { version = "0.3.0", features = ["futures"] }
futures = "0.3.31"
console_log = "1.0.0"

[build-dependencies]
anyhow = { version = "1.0.79", features = ["backtrace"] }
glob = "0.3.1"
tonic-build = "^0.8"

# Pin these versions to fix iOS build issues
[target.'cfg(target_os = "ios")'.build-dependencies]
security-framework = "=2.10.0"
security-framework-sys = "=2.10.0"
